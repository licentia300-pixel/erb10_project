{% extends 'pages/base.html' %}

{% block title %}MyWallpaper - Gallery{% endblock %}

{% block content %}
<div class="container py-5">
  <h2 class="mb-2">Wallpaper Gallery</h2>
  <p class="text-muted mb-4">Browse free 4K wallpapers by category</p>

  <div class="mb-4">
    <a href="{% url 'listings' %}" class="btn btn-dark btn-sm mr-1 mb-1">All</a>
    <a href="{% url 'listings' %}" class="btn btn-outline-dark btn-sm mr-1 mb-1">City View</a>
    <a href="{% url 'listings' %}" class="btn btn-outline-dark btn-sm mr-1 mb-1">Animation</a>
    <a href="{% url 'listings' %}" class="btn btn-outline-dark btn-sm mr-1 mb-1">Nature</a>
    <a href="{% url 'listings' %}" class="btn btn-outline-dark btn-sm mr-1 mb-1">Space</a>
  </div>

  <div class="row">
    <!-- paste all the card columns from your original listings.html here -->
    <!-- (I kept the structure identical so you can just copy the cards) -->
    <div class="col-md-6 col-lg-4 mb-4">
      <div class="card h-100 shadow-sm">
        <img src="https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg?auto=compress&cs=tinysrgb&w=600" class="card-img-top" alt="">
        <div class="card-body">
          <h5 class="card-title">Mountain Sunset</h5>
          <p class="card-text text-muted small">Nature · 3840×2160</p>
          <a href="{% url 'listing' %}" class="btn btn-outline-dark btn-sm">View</a>
        </div>
      </div>
    </div>
    <!-- ... continue with the rest of the cards exactly as in your original file ... -->
  </div>

  <nav class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item disabled"><a class="page-link" href="#">&laquo;</a></li>
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">3</a></li>
      <li class="page-item"><a class="page-link" href="#">&raquo;</a></li>
    </ul>
  </nav>
</div>
{% endblock %}
