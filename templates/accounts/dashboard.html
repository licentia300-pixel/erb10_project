{% extends 'pages/base.html' %}

{% block title %}MyWallpaper - Dashboard{% endblock %}

{% block extra_css %}
<style>
  .card img { height: 160px; object-fit: cover; }
</style>
{% endblock %}

{% block content %}
<div class="container py-5">
  <h2 class="font-weight-bold mb-1">Your Bookmarks</h2>
  <p class="text-muted mb-4">Welcome back, John. Here are the wallpapers you have saved.</p>

  <div class="row">
    <!-- paste the 4 bookmark cards from your original dashboard.html here -->
    <div class="col-md-6 col-lg-3 mb-4">
      <div class="card h-100 shadow-sm">
        <img src="https://images.pexels.com/photos/1366919/pexels-photo-1366919.jpeg?auto=compress&cs=tinysrgb&w=500" class="card-img-top" alt="">
        <div class="card-body">
          <h6 class="card-title mb-1">Mountain Sunset</h6>
          <p class="card-text text-muted small mb-2">Nature · 3840×2160</p>
          <a href="{% url 'listing' %}" class="btn btn-outline-dark btn-sm mr-1">View</a>
          <a href="#" class="btn btn-outline-danger btn-sm">Delete</a>
        </div>
      </div>
    </div>
    <!-- ... rest of the cards ... -->
  </div>
</div>
{% endblock %}
