{% extends "base.html" %}

{% block title %}MyWallpaper - Register{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="font-weight-bold mb-1">Join MyWallpaper</h3>
          <p class="text-muted mb-4">Create an account to bookmark wallpapers.</p>
          <form method="post" action="">
            {% csrf_token %}
            <!-- 新增 username 字段 -->
            <div class="form-group">
              <label>Username</label>
              <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="form-row">
              <div class="form-group col-md-6">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" required>
              </div>
              <div class="form-group col-md-6">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" required>
              </div>
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Confirm Password</label>
              <input type="password" name="password2" class="form-control" required>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="terms">
              <label class="form-check-label" for="terms">I agree to the terms</label>
            </div>
            <button type="submit" class="btn btn-dark btn-block">Create Account</button>
          </form>
          <p class="text-center mt-3 mb-0 text-muted small">
            Already have an account? <a href="{% url 'accounts:login' %}" class="text-dark font-weight-bold">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
