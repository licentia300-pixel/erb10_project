{% extends 'pages/base.html' %}

{% block title %}MyWallpaper - Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="font-weight-bold mb-1">Welcome back</h3>
          <p class="text-muted mb-4">Sign in to bookmark wallpapers.</p>
          <form method="post" action="">
            {% csrf_token %}
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <div class="form-group form-check">
              <input type="checkbox" class="form-check-input" id="remember">
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-dark btn-block">Log In</button>
          </form>
          <p class="text-center mt-3 mb-0 text-muted small">
            Don’t have an account? <a href="{% url 'register' %}" class="text-dark font-weight-bold">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
